<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Acesse o portal de treinamento interno da Loja Bezerra Autopeças.">

    <meta name="keywords"
        content="treinamento interno, EAD Bezerra Autopeças, curso mecânica automotiva, curso excel, atendimento ao cliente, capacitação de colaboradores">

    <title>Entrar | Treinamento Interno - Loja Bezerra Autopeças</title>


    <!-- =====================================================
         FONTES
    ====================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">


    <!-- =====================================================
         ÍCONES
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <!-- =====================================================
         ESTILOS
    ====================================================== -->

    <style>

        /* =====================================================
           RESET
        ====================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Inter", Arial, sans-serif;
            background: #070b12;
            color: #ffffff;
            line-height: 1.6;
            overflow-x: hidden;
        }

        img {
            display: block;
            width: 100%;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button,
        input,
        textarea,
        select {
            font-family: inherit;
        }


        /* =====================================================
           CORES
        ====================================================== */

        :root {

            --primary: #f5c400;

            --primary-light: #ffd83d;

            --primary-dark: #d4a900;

            --dark: #070b12;

            --dark-2: #0d131d;

            --dark-3: #111a27;

            --dark-4: #172233;

            --white: #ffffff;

            --gray: #aab4c3;

            --gray-dark: #697586;

            --border: rgba(255,255,255,0.09);

            --blue: #1688ff;

            --green: #20b66f;

        }


        /* =====================================================
           CONTAINER
        ====================================================== */

        .container {

            width: 90%;

            max-width: 1200px;

            margin: 0 auto;

        }


        /* =====================================================
           HEADER
        ====================================================== */

        header {

            position: fixed;

            top: 0;

            left: 0;

            width: 100%;

            height: 76px;

            z-index: 9999;

            background: rgba(7,11,18,0.94);

            backdrop-filter: blur(15px);

            border-bottom: 1px solid var(--border);

        }

        .header-content {

            height: 76px;

            display: flex;

            align-items: center;

            justify-content: space-between;

        }


        /* LOGO */

        .logo {

            display: flex;

            align-items: center;

            gap: 10px;

            font-size: 20px;

            font-weight: 900;

            letter-spacing: -0.5px;

        }

        .logo-icon {

            width: 42px;

            height: 42px;

            border-radius: 10px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: var(--primary);

            color: #000;

            font-size: 21px;

        }

        .logo-text span {

            color: var(--primary);

        }

        .logo-sub {

            display: block;

            font-size: 8px;

            letter-spacing: 2px;

            color: var(--primary);

            margin-top: -3px;

        }


        /* MENU */

        .nav-menu {

            display: flex;

            align-items: center;

            gap: 28px;

            list-style: none;

        }

        .nav-menu a {

            font-size: 13px;

            color: #c7ced8;

            font-weight: 600;

            transition: 0.3s;

        }

        .nav-menu a:hover {

            color: var(--primary);

        }


        .nav-button {

            border: 1px solid var(--primary);

            padding: 10px 18px;

            border-radius: 25px;

            color: var(--primary) !important;

        }

        .nav-button:hover {

            background: var(--primary);

            color: #000 !important;

        }


        /* MOBILE */

        .mobile-button {

            display: none;

            border: 0;

            background: transparent;

            color: #fff;

            font-size: 25px;

            cursor: pointer;

        }


        /* =====================================================
           HERO
        ====================================================== */

        .hero {

            min-height: 100vh;

            padding-top: 76px;

            position: relative;

            display: flex;

            align-items: center;

            overflow: hidden;

            background:

                linear-gradient(

                    90deg,

                    rgba(5,10,17,0.98) 0%,

                    rgba(5,10,17,0.91) 42%,

                    rgba(5,10,17,0.40) 72%,

                    rgba(5,10,17,0.90) 100%

                ),

                url("https://images.unsplash.com/photo-1487754180451-c456f719a1fc?auto=format&fit=crop&w=2000&q=85");

            background-size: cover;

            background-position: center;

        }

        .hero::after {

            content: "";

            position: absolute;

            width: 500px;

            height: 500px;

            right: -180px;

            top: 120px;

            border-radius: 50%;

            border: 80px solid rgba(245,196,0,0.06);

        }

        .hero-content {

            max-width: 720px;

            position: relative;

            z-index: 2;

            padding: 80px 0;

        }


        .hero-label {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding: 8px 14px;

            border-radius: 30px;

            background: rgba(245,196,0,0.12);

            border: 1px solid rgba(245,196,0,0.30);

            color: var(--primary);

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 1.3px;

            text-transform: uppercase;

            margin-bottom: 25px;

        }

        .hero h1 {

            font-size: clamp(42px, 6vw, 72px);

            line-height: 1.04;

            letter-spacing: -3px;

            margin-bottom: 25px;

        }

        .hero h1 span {

            color: var(--primary);

        }

        .hero-description {

            max-width: 650px;

            color: #c5ced9;

            font-size: 18px;

            margin-bottom: 35px;

        }


        .hero-buttons {

            display: flex;

            flex-wrap: wrap;

            gap: 14px;

            margin-bottom: 45px;

        }


        /* BOTÕES */

        .btn {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

            padding: 14px 23px;

            border-radius: 8px;

            font-size: 14px;

            font-weight: 800;

            cursor: pointer;

            border: none;

            transition: .3s;

        }

        .btn-primary {

            background: var(--primary);

            color: #000;

        }

        .btn-primary:hover {

            background: #fff;

            transform: translateY(-3px);

        }

        .btn-outline {

            border: 1px solid rgba(255,255,255,0.25);

            color: #fff;

            background: rgba(255,255,255,0.03);

        }

        .btn-outline:hover {

            border-color: var(--primary);

            color: var(--primary);

            transform: translateY(-3px);

        }


        /* HERO BENEFÍCIOS */

        .hero-features {

            display: flex;

            gap: 35px;

            flex-wrap: wrap;

        }

        .hero-feature {

            display: flex;

            align-items: center;

            gap: 11px;

        }

        .hero-feature-icon {

            width: 43px;

            height: 43px;

            border-radius: 50%;

            background: rgba(245,196,0,0.15);

            color: var(--primary);

            display: flex;

            align-items: center;

            justify-content: center;

        }

        .hero-feature strong {

            display: block;

            font-size: 13px;

        }

        .hero-feature small {

            display: block;

            color: #9da8b7;

            font-size: 11px;

        }


        /* =====================================================
           BARRA DE INDICADORES
        ====================================================== */

        .stats {

            background: var(--primary);

            color: #000;

            padding: 27px 0;

        }

        .stats-grid {

            display: grid;

            grid-template-columns: repeat(4,1fr);

            text-align: center;

        }

        .stat {

            border-right: 1px solid rgba(0,0,0,0.15);

        }

        .stat:last-child {

            border-right: 0;

        }

        .stat strong {

            display: block;

            font-size: 28px;

            font-weight: 900;

        }

        .stat span {

            font-size: 12px;

            font-weight: 700;

        }


        /* =====================================================
           SEÇÕES
        ====================================================== */

        section {

            padding: 100px 0;

        }

        .section-header {

            max-width: 700px;

            margin: 0 auto 55px;

            text-align: center;

        }

        .section-label {

            color: var(--primary);

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 2px;

            text-transform: uppercase;

        }

        .section-header h2 {

            font-size: clamp(30px,4vw,43px);

            line-height: 1.15;

            letter-spacing: -1px;

            margin: 10px 0 15px;

        }

        .section-header p {

            color: var(--gray);

            font-size: 15px;

        }


        /* =====================================================
           SOBRE
        ====================================================== */

        .about {

            background: var(--dark-2);

        }

        .about-grid {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 70px;

            align-items: center;

        }

        .about-image {

            position: relative;

        }

        .about-image img {

            height: 480px;

            object-fit: cover;

            border-radius: 18px;

        }

        .about-image-badge {

            position: absolute;

            bottom: 25px;

            right: -25px;

            background: var(--primary);

            color: #000;

            padding: 18px 22px;

            border-radius: 12px;

            font-weight: 900;

            box-shadow: 0 15px 40px rgba(0,0,0,0.35);

        }

        .about-content h2 {

            font-size: 40px;

            line-height: 1.15;

            margin-bottom: 20px;

        }

        .about-content h2 span {

            color: var(--primary);

        }

        .about-content p {

            color: var(--gray);

            margin-bottom: 17px;

        }

        .about-list {

            list-style: none;

            margin-top: 25px;

        }

        .about-list li {

            display: flex;

            gap: 12px;

            margin-bottom: 13px;

            color: #dce2e9;

            font-size: 14px;

        }

        .about-list i {

            color: var(--primary);

            margin-top: 5px;

        }


        /* =====================================================
           CURSOS
        ====================================================== */

        .courses {

            background: #080c13;

        }

        .courses-grid {

            display: grid;

            grid-template-columns: repeat(3,1fr);

            gap: 25px;

        }

        .course-card {

            background: var(--dark-3);

            border: 1px solid var(--border);

            border-radius: 16px;

            overflow: hidden;

            transition: .35s;

        }

        .course-card:hover {

            transform: translateY(-8px);

            border-color: rgba(245,196,0,0.5);

            box-shadow: 0 20px 50px rgba(0,0,0,0.35);

        }

        .course-image {

            position: relative;

            height: 235px;

            overflow: hidden;

        }

        .course-image img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            transition: .5s;

        }

        .course-card:hover .course-image img {

            transform: scale(1.07);

        }

        .course-overlay {

            position: absolute;

            inset: 0;

            background: linear-gradient(

                transparent 40%,

                rgba(0,0,0,0.75)

            );

        }

        .course-icon {

            position: absolute;

            bottom: 18px;

            left: 18px;

            width: 50px;

            height: 50px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            background: var(--primary);

            color: #000;

            font-size: 20px;

        }

        .course-content {

            padding: 25px;

        }

        .course-tag {

            color: var(--primary);

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 1.5px;

            text-transform: uppercase;

        }

        .course-content h3 {

            font-size: 23px;

            margin: 7px 0 12px;

        }

        .course-content p {

            color: var(--gray);

            font-size: 13px;

            min-height: 65px;

        }

        .course-meta {

            border-top: 1px solid var(--border);

            margin-top: 20px;

            padding-top: 17px;

            display: flex;

            justify-content: space-between;

            color: #9da8b7;

            font-size: 12px;

        }

        .course-button {

            margin-top: 20px;

            width: 100%;

            padding: 11px;

            border-radius: 7px;

            border: 1px solid rgba(245,196,0,0.4);

            color: var(--primary);

            background: transparent;

            font-weight: 700;

            cursor: pointer;

            transition: .3s;

        }

        .course-button:hover {

            background: var(--primary);

            color: #000;

        }


        /* =====================================================
           METODOLOGIA
        ====================================================== */

        .method {

            background: var(--dark-2);

        }

        .method-grid {

            display: grid;

            grid-template-columns: repeat(4,1fr);

            gap: 20px;

        }

        .method-card {

            position: relative;

            overflow: hidden;

            min-height: 270px;

            border-radius: 15px;

            background: var(--dark-3);

            border: 1px solid var(--border);

            padding: 28px;

        }

        .method-number {

            font-size: 55px;

            font-weight: 900;

            color: rgba(245,196,0,0.10);

            position: absolute;

            top: 5px;

            right: 15px;

        }

        .method-icon {

            width: 55px;

            height: 55px;

            background: var(--primary);

            color: #000;

            border-radius: 12px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 20px;

            margin-bottom: 25px;

        }

        .method-card h3 {

            margin-bottom: 10px;

        }

        .method-card p {

            color: var(--gray);

            font-size: 13px;

        }


        /* =====================================================
           BENEFÍCIOS COM IMAGEM
        ====================================================== */

        .benefits {

            background: #080c13;

        }

        .benefits-grid {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 60px;

            align-items: center;

        }

        .benefits-image {

            position: relative;

        }

        .benefits-image img {

            height: 500px;

            object-fit: cover;

            border-radius: 18px;

        }

        .benefits-content h2 {

            font-size: 40px;

            line-height: 1.15;

            margin-bottom: 30px;

        }

        .benefits-content h2 span {

            color: var(--primary);

        }

        .benefit-item {

            display: flex;

            gap: 17px;

            margin-bottom: 23px;

        }

        .benefit-icon {

            min-width: 48px;

            height: 48px;

            border-radius: 50%;

            background: rgba(245,196,0,0.12);

            color: var(--primary);

            display: flex;

            align-items: center;

            justify-content: center;

        }

        .benefit-item h3 {

            font-size: 16px;

            margin-bottom: 3px;

        }

        .benefit-item p {

            color: var(--gray);

            font-size: 13px;

        }


        /* =====================================================
           EQUIPE / TREINAMENTO
        ====================================================== */

        .training {

            position: relative;

            background:

                linear-gradient(

                    rgba(7,11,18,0.88),

                    rgba(7,11,18,0.94)

                ),

                url("https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&fit=crop&w=2000&q=85");

            background-size: cover;

            background-position: center;

            background-attachment: fixed;

            text-align: center;

        }

        .training-content {

            max-width: 800px;

            margin: auto;

        }

        .training h2 {

            font-size: clamp(32px,5vw,52px);

            line-height: 1.1;

            margin-bottom: 20px;

        }

        .training h2 span {

            color: var(--primary);

        }

        .training p {

            color: #c4ccd6;

            margin-bottom: 30px;

        }


        /* =====================================================
           CTA
        ====================================================== */

        .cta {

            padding: 80px 0;

            background: var(--primary);

            color: #000;

        }

        .cta-grid {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 40px;

        }

        .cta h2 {

            font-size: 40px;

            line-height: 1.1;

            max-width: 650px;

        }

        .cta p {

            margin-top: 12px;

            max-width: 650px;

        }

        .cta .btn {

            background: #000;

            color: #fff;

            white-space: nowrap;

        }

        .cta .btn:hover {

            background: #222;

            transform: translateY(-3px);

        }


        /* =====================================================
           CONTATO
        ====================================================== */

        .contact {

            background: var(--dark-2);

        }

        .contact-grid {

            display: grid;

            grid-template-columns: 0.9fr 1.1fr;

            gap: 70px;

        }

        .contact-info h2 {

            font-size: 40px;

            line-height: 1.1;

            margin-bottom: 20px;

        }

        .contact-info h2 span {

            color: var(--primary);

        }

        .contact-info > p {

            color: var(--gray);

            margin-bottom: 30px;

        }

        .contact-item {

            display: flex;

            gap: 15px;

            align-items: center;

            margin-bottom: 20px;

        }

        .contact-icon {

            min-width: 48px;

            height: 48px;

            border-radius: 10px;

            background: var(--dark-4);

            color: var(--primary);

            display: flex;

            align-items: center;

            justify-content: center;

        }

        .contact-item strong {

            display: block;

            font-size: 13px;

        }

        .contact-item span {

            display: block;

            color: var(--gray);

            font-size: 13px;

        }


        /* FORMULÁRIO */

        .contact-form {

            background: var(--dark-3);

            border: 1px solid var(--border);

            padding: 30px;

            border-radius: 16px;

        }

        .contact-form h3 {

            margin-bottom: 25px;

            font-size: 22px;

        }

        .form-group {

            margin-bottom: 17px;

        }

        .form-group label {

            display: block;

            font-size: 12px;

            color: #c7ced8;

            margin-bottom: 7px;

        }

        .form-control {

            width: 100%;

            background: #080d15;

            border: 1px solid rgba(255,255,255,0.10);

            border-radius: 7px;

            color: #fff;

            padding: 13px;

            outline: none;

        }

        .form-control:focus {

            border-color: var(--primary);

        }

        textarea.form-control {

            resize: vertical;

            min-height: 120px;

        }

        .form-row {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 15px;

        }


        /* =====================================================
           FOOTER
        ====================================================== */

        footer {

            background: #04070b;

            border-top: 1px solid var(--border);

            padding: 60px 0 25px;

        }

        .footer-grid {

            display: grid;

            grid-template-columns: 1.5fr 1fr 1fr 1fr;

            gap: 45px;

            padding-bottom: 40px;

        }

        .footer-description {

            color: var(--gray);

            font-size: 13px;

            max-width: 300px;

            margin-top: 15px;

        }

        .footer-column h4 {

            color: #fff;

            font-size: 13px;

            margin-bottom: 18px;

        }

        .footer-column ul {

            list-style: none;

        }

        .footer-column li {

            margin-bottom: 10px;

        }

        .footer-column a {

            color: var(--gray);

            font-size: 12px;

            transition: .3s;

        }

        .footer-column a:hover {

            color: var(--primary);

        }

        .socials {

            display: flex;

            gap: 9px;

            margin-top: 20px;

        }

        .social {

            width: 35px;

            height: 35px;

            border-radius: 50%;

            background: var(--dark-3);

            display: flex;

            align-items: center;

            justify-content: center;

            color: #fff;

            transition: .3s;

        }

        .social:hover {

            background: var(--primary);

            color: #000;

        }

        .copyright {

            border-top: 1px solid var(--border);

            padding-top: 20px;

            color: #687383;

            font-size: 11px;

            text-align: center;

        }


        /* =====================================================
           WHATSAPP
        ====================================================== */

        .whatsapp {

            position: fixed;

            right: 22px;

            bottom: 22px;

            width: 58px;

            height: 58px;

            border-radius: 50%;

            background: #20c967;

            color: #fff;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 26px;

            z-index: 9998;

            box-shadow: 0 10px 30px rgba(0,0,0,.4);

            transition: .3s;

        }

        .whatsapp:hover {

            transform: scale(1.1);

        }


        /* =====================================================
           ANIMAÇÕES
        ====================================================== */

        .fade-up {

            opacity: 0;

            transform: translateY(30px);

            transition: .8s ease;

        }

        .fade-up.visible {

            opacity: 1;

            transform: translateY(0);

        }


        /* =====================================================
           RESPONSIVO
        ====================================================== */

        @media(max-width: 1000px) {

            .nav-menu {

                position: absolute;

                top: 76px;

                left: 0;

                width: 100%;

                display: none;

                flex-direction: column;

                align-items: flex-start;

                padding: 25px;

                background: #080c13;

                border-bottom: 1px solid var(--border);

            }

            .nav-menu.active {

                display: flex;

            }

            .mobile-button {

                display: block;

            }

            .method-grid {

                grid-template-columns: repeat(2,1fr);

            }

            .courses-grid {

                grid-template-columns: repeat(2,1fr);

            }

            .footer-grid {

                grid-template-columns: repeat(2,1fr);

            }

        }


        @media(max-width: 750px) {

            section {

                padding: 75px 0;

            }

            .hero {

                min-height: auto;

            }

            .hero-content {

                padding: 80px 0;

            }

            .hero h1 {

                letter-spacing: -2px;

            }

            .hero-features {

                gap: 18px;

            }

            .stats-grid {

                grid-template-columns: repeat(2,1fr);

                gap: 20px;

            }

            .stat {

                border-right: 0;

            }

            .about-grid,

            .benefits-grid,

            .contact-grid {

                grid-template-columns: 1fr;

                gap: 40px;

            }

            .about-image img,

            .benefits-image img {

                height: 350px;

            }

            .about-image-badge {

                right: 15px;

            }

            .courses-grid {

                grid-template-columns: 1fr;

            }

            .method-grid {

                grid-template-columns: 1fr;

            }

            .cta-grid {

                flex-direction: column;

                align-items: flex-start;

            }

            .footer-grid {

                grid-template-columns: 1fr 1fr;

            }

        }


        @media(max-width: 500px) {

            .container {

                width: 92%;

            }

            .hero h1 {

                font-size: 40px;

            }

            .hero-description {

                font-size: 15px;

            }

            .hero-buttons {

                flex-direction: column;

            }

            .hero-buttons .btn {

                width: 100%;

            }

            .hero-features {

                flex-direction: column;

            }

            .stats-grid {

                grid-template-columns: 1fr 1fr;

            }

            .form-row {

                grid-template-columns: 1fr;

            }

            .footer-grid {

                grid-template-columns: 1fr;

            }

            .cta h2 {

                font-size: 30px;

            }

        }



        /* =====================================================
           LOGIN
        ====================================================== */

        .login-section {

            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 20px 60px;

        }

        .login-box {

            width: 100%;
            max-width: 400px;
            background: var(--dark-2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;

        }

        .login-box .logo {
            justify-content: center;
            margin-bottom: 26px;
        }

        .login-title {

            font-size: 20px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 6px;

        }

        .login-subtitle {

            text-align: center;
            color: var(--gray-dark);
            font-size: 13px;
            margin-bottom: 30px;

        }

        .login-tabs {

            display: flex;
            background: var(--dark-4);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 26px;

        }

        .login-tab {

            flex: 1;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            color: var(--gray);
            cursor: pointer;
            transition: 0.25s;
            border: 0;
            background: transparent;

        }

        .login-tab.active {

            background: var(--primary);
            color: #000;

        }

        .login-form {
            display: none;
        }

        .login-form.active {
            display: block;
        }

        .login-message {

            font-size: 12.5px;
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 18px;
            display: none;

        }

        .login-message.show {
            display: block;
        }

        .login-message.error {

            background: rgba(255,80,80,0.10);
            border: 1px solid rgba(255,80,80,0.30);
            color: #ff8f8f;

        }

        .login-message.success {

            background: rgba(32,182,111,0.10);
            border: 1px solid rgba(32,182,111,0.30);
            color: var(--green);

        }

        .login-form button[type="submit"] {

            width: 100%;
            justify-content: center;
            margin-top: 6px;

        }

        .login-footnote {

            text-align: center;
            font-size: 11.5px;
            color: var(--gray-dark);
            margin-top: 22px;

        }


    </style>

</head>

<body>



<section class="login-section">

    <div class="login-box">

        <a href="preview.html" class="logo">

            <div class="logo-icon">
                <i class="fa-solid fa-gear"></i>
            </div>

            <div class="logo-text">
                BEZERRA<span>AUTOPEÇAS</span>
                <small class="logo-sub">TREINAMENTO INTERNO</small>
            </div>

        </a>


        <div class="login-title">Acesse a plataforma</div>
        <div class="login-subtitle">Portal de treinamento dos colaboradores</div>


        <div class="login-tabs">

            <button class="login-tab active" data-tab="entrar">Entrar</button>
            <button class="login-tab" data-tab="criar">Criar conta</button>

        </div>


        <div class="login-message" id="loginMessage"></div>


        <!-- ENTRAR -->

        <form class="login-form active" id="formEntrar">

            <div class="form-group">
                <label>E-mail</label>
                <input type="email" class="form-control" id="entrarEmail" placeholder="seu@email.com" required>
            </div>

            <div class="form-group">
                <label>Senha</label>
                <input type="password" class="form-control" id="entrarSenha" placeholder="Sua senha" required>
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-right-to-bracket"></i>
                Entrar
            </button>

        </form>


        <!-- CRIAR CONTA -->

        <form class="login-form" id="formCriar">

            <div class="form-group">
                <label>Nome</label>
                <input type="text" class="form-control" id="criarNome" placeholder="Seu nome completo" required>
            </div>

            <div class="form-group">
                <label>Setor</label>
                <input type="text" class="form-control" id="criarSetor" placeholder="Ex: Vendas, Estoque, Oficina">
            </div>

            <div class="form-group">
                <label>E-mail</label>
                <input type="email" class="form-control" id="criarEmail" placeholder="seu@email.com" required>
            </div>

            <div class="form-group">
                <label>Senha</label>
                <input type="password" class="form-control" id="criarSenha" placeholder="Crie uma senha (mín. 6 caracteres)" minlength="6" required>
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-user-plus"></i>
                Criar conta
            </button>

        </form>


        <div class="login-footnote">
            Dúvidas de acesso? Fale com o RH da loja.
        </div>

    </div>

</section>




<script>

    const loginMessage = document.getElementById("loginMessage");

    function mostrarMensagem(texto, tipo) {

        loginMessage.textContent = texto;
        loginMessage.className = "login-message show " + tipo;

    }


    /* Alternar entre abas Entrar / Criar conta */

    document.querySelectorAll(".login-tab").forEach(function (tab) {

        tab.addEventListener("click", function () {

            document.querySelectorAll(".login-tab").forEach(function (t) {
                t.classList.remove("active");
            });

            document.querySelectorAll(".login-form").forEach(function (f) {
                f.classList.remove("active");
            });

            tab.classList.add("active");

            const alvo = tab.getAttribute("data-tab") === "entrar" ? "formEntrar" : "formCriar";
            document.getElementById(alvo).classList.add("active");

            loginMessage.classList.remove("show");

        });

    });


    /* Se já estiver logado, vai direto para o curso */

    (async function verificarSessao() {

        const { data } = await supabaseClient.auth.getSession();

        if (data.session) {

            window.location.href = "curso-atendimento.html";

        }

    })();


    /* Entrar */

    document
        .getElementById("formEntrar")
        .addEventListener("submit", async function (event) {

            event.preventDefault();

            const email = document.getElementById("entrarEmail").value;
            const senha = document.getElementById("entrarSenha").value;

            const { error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: senha
            });

            if (error) {

                mostrarMensagem("Não foi possível entrar: " + error.message, "error");

            } else {

                window.location.href = "curso-atendimento.html";

            }

        });


    /* Criar conta */

    document
        .getElementById("formCriar")
        .addEventListener("submit", async function (event) {

            event.preventDefault();

            const nome = document.getElementById("criarNome").value;
            const setor = document.getElementById("criarSetor").value;
            const email = document.getElementById("criarEmail").value;
            const senha = document.getElementById("criarSenha").value;

            const { data, error } = await supabaseClient.auth.signUp({
                email: email,
                password: senha
            });

            if (error) {

                mostrarMensagem("Não foi possível criar a conta: " + error.message, "error");
                return;

            }

            if (data.user) {

                await supabaseClient
                    .from("colaboradores")
                    .insert({ id: data.user.id, nome: nome, setor: setor });

            }

            if (data.session) {

                window.location.href = "curso-atendimento.html";

            } else {

                mostrarMensagem(
                    "Conta criada! Verifique seu e-mail para confirmar o acesso antes de entrar.",
                    "success"
                );

            }

        });

</script>


</body>

</html>
